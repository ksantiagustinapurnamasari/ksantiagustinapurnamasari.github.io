name: Publish biodata to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: biodata-github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v7.0.1
      - name: Prepare website files
        run: |
          mkdir -p _site
          cp index.html styles.css theme.css script.js .nojekyll _site/
          cp -R assets _site/assets
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish website
        id: deploy
        uses: actions/deploy-pages@v5
        with:
          timeout: 1200000
